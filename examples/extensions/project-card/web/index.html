<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>项目卡片</title><link rel="stylesheet" href="style.css"></head>
<body><main>
 <header><div><h1 data-message="title">项目卡片</h1><p data-message="subtitle">了解项目，从这里开始。</p></div><button id="choose" class="primary" disabled>选择项目</button></header>
 <section id="empty" class="empty" aria-labelledby="empty-title"><div class="symbol" aria-hidden="true"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 8h8M8 12h8M8 16h4"/></svg></div><h2 id="empty-title" data-message="empty">项目概况，一目了然</h2><p data-message="intro">选择一个本地项目，在这里查看它的名称与说明。</p></section>
 <section id="card" class="card" hidden aria-labelledby="project-name"><div class="card-heading"><h2 id="project-name"></h2><button id="refresh" data-message="refresh">刷新</button></div><p id="project-description"></p><dl><dt data-message="id">项目 ID</dt><dd id="project-id"></dd></dl></section>
 <div class="feedback"><p id="status" role="status" aria-live="polite"></p><button id="cancel" data-message="cancel" hidden>取消</button></div>
 <footer data-message="note">由你决定分享什么，工作目录始终保持私密。</footer>
 </main><script type="module" src="app.js"></script></body></html>
