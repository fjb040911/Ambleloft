<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#25272b;background:#fff;color-scheme:light}*{box-sizing:border-box}body{margin:0;padding:16px 20px}form{display:grid;gap:16px}label{display:grid;gap:8px;font-size:13px}input{font:inherit;padding:10px 12px;border:1px solid #d8dbe0;border-radius:10px;background:transparent;color:inherit}button{justify-self:start;font:inherit;padding:10px 18px;border:0;border-radius:10px;background:#3467cc;color:#fff;cursor:pointer}button:disabled{opacity:.5;cursor:default}p{font-size:12px;line-height:1.6;color:#6c727c;margin:0}#status{min-height:20px}input:focus-visible,button:focus-visible{outline:3px solid #89aaff;outline-offset:2px}:root[data-theme=dark]{background:#202124;color:#eee;color-scheme:dark}:root[data-theme=dark] input{border-color:#51545b}:root[data-theme=dark] p{color:#b8bdc6}
</style></head><body><form id="form"><p>这是本地演示。保存后不会向财务系统提交报销。</p><label>出差地点<input id="destination" required maxlength="120"></label><label>金额（元）<input id="amount" type="number" min="0" max="1000000" step="0.01" required></label><button id="save" disabled>保存到本地记录</button><p id="status" role="status">正在准备表单…</p></form>
<script>
let sequence=0;const pending=new Map();const status=document.querySelector('#status'),button=document.querySelector('#save');
function send(method,params){const id=++sequence;return new Promise((resolve,reject)=>{pending.set(id,{resolve,reject});window.parent.postMessage({jsonrpc:'2.0',id,method,params},'*');});}
function notify(method,params={}){window.parent.postMessage({jsonrpc:'2.0',method,params},'*');}
function render(value){document.querySelector('#destination').value=value.destination;document.querySelector('#amount').value=value.amount;button.disabled=false;status.textContent='请核对后保存。';}
window.addEventListener('message',event=>{
 if(event.source!==window.parent||event.data?.jsonrpc!=='2.0')return;const m=event.data;
 if(pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);m.error?p.reject(m.error):p.resolve(m.result);return;}
 if(m.method==='ui/notifications/tool-result'&&m.params.structuredContent)render(m.params.structuredContent);
 if(m.method==='ui/notifications/host-context-changed'&&m.params.theme)document.documentElement.dataset.theme=m.params.theme;
 if(m.method==='ui/resource-teardown'){button.disabled=true;window.parent.postMessage({jsonrpc:'2.0',id:m.id,result:{}},'*');}
});
send('ui/initialize',{protocolVersion:'2026-01-26',appInfo:{name:'travel-form',version:'0.1.0'},appCapabilities:{availableDisplayModes:['inline']}}).then(result=>{document.documentElement.dataset.theme=result.hostContext.theme;notify('ui/notifications/initialized');new ResizeObserver(()=>notify('ui/notifications/size-changed',{height:document.body.scrollHeight+32})).observe(document.body);}).catch(()=>status.textContent='当前版本暂时无法打开表单。');
document.querySelector('#form').onsubmit=async event=>{event.preventDefault();button.disabled=true;status.textContent='等待确认…';try{const result=await send('tools/call',{name:'example.task-form.save',arguments:{destination:document.querySelector('#destination').value,amount:Number(document.querySelector('#amount').value)}});status.textContent=result.isError?'未能确认保存结果。请核实后再操作，不要重复提交。':'已保存到本地记录。';}catch{status.textContent='未能确认保存结果。请核实后再操作，不要重复提交。';}finally{button.disabled=false;}};
</script></body></html>
