name: Platform compatibility
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compatibility:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Extension, skill, file application and terminal regressions
        run: node --test --test-concurrency=2 tests/extension-packages.test.cjs tests/extension-hosts.test.cjs tests/skills.test.cjs tests/file-applications.test.cjs tests/terminal.test.cjs tests/docker.test.cjs tests/creation.test.cjs
      - name: Plan acceptance and recovery regressions
        run: node --test --test-concurrency=2 tests/workforce-acceptance.test.cjs tests/workforce-complex-acceptance.test.cjs tests/workforce-plans.test.cjs tests/workforce-task-guide.test.cjs tests/native-subagents.test.cjs tests/conversation-data.test.cjs
