name: Publish Windows update
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (vX.Y.Z)
        required: true
permissions:
  contents: write
concurrency:
  group: windows-update-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node -e "if(process.env.RELEASE_TAG!=='v'+require('./package.json').version)process.exit(1)"
      - run: npm ci
      - run: node --test tests/updates.test.cjs tests/windows-release.test.cjs
      - name: Build Windows preview
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:win
      - run: node scripts/test-packaged-windows.mjs
      - name: Verify, upload and publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run release:win
