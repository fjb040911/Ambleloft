name: macOS preview build
on:
  workflow_dispatch:
    inputs:
      target:
        required: true
        description: Commit to retest
permissions:
  contents: read
jobs:
  retest-rolling-history:
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install chromium
      - run: npx playwright test tests/e2e/chat.spec.ts tests/e2e/composer.spec.ts --grep 'rolling history snapshots|long history preserves|background updates and switching|existing task confirms' --workers=2 --repeat-each=5 --reporter=line --trace retain-on-failure
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rolling-history-macos-retest
          path: test-results/
